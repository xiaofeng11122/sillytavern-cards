<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .phase { color: #a08c6a; }

  .switchbtn:hover { border-color: #b08d57; background: #f7efe2; }
  .bars { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  .bar { flex: 1 1 160px; }
  .bar .lab { display: flex; justify-content: space-between; font-size: 10px; color: #8a6a35; }
  .bar .track { height: 5px; border-radius: 3px; background: #efe8dd; margin-top: 1px; }
  .bar .fill { height: 5px; border-radius: 3px; background: #b08d57; }

  .panel { margin-top: 8px; border: 1px solid #e3ddd5; border-radius: 8px; background: #fff; overflow: hidden; }
  .phead { padding: 7px 12px; font-size: 12px; font-weight: 600; color: #6b5f52; cursor: pointer; background: #faf6ef; user-select: none; }
  .phead:hover { color: #8a6a35; }
  .pbody { padding: 10px 12px 12px; border-top: 1px solid #efe8dd; }
  .hd { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
  .sub { font-size: 12px; color: #8a8a8a; margin: 4px 0 10px; line-height: 1.6; }

  /* ---------- 单人轮播生成器 ---------- */

  .arrow:hover { border-color: #b08d57; background: #f7efe2; }

  .stage { flex: 1 1 auto; min-width: 0; }
  .card { border: 1px solid #e3ddd5; border-radius: 8px; padding: 10px 12px; background: #ffffff; }

  .kinks { margin-top: 2px; }
  .chip { display: inline-block; padding: 1px 7px; margin: 2px 3px 2px 0; border: 1px solid #d8cfc4; border-radius: 10px; font-size: 11px; color: #6b5f52; background: #fff; }

      '性格：外 ' + (h['外在性格'] || '') + ' × 内 ' + (h['内在性格'] || ''),
      '已解锁性癖：' + (kinks.length ? kinks.join('、') : '尚未解锁'),
      '好感度 ' + (h['好感度'] || 0) + '（' + stageOf(h['好感度'] || 0) + '）· 性欲 ' + (h['性欲'] || 0),
      '预约：' + (h['预约类型'] || '到店') + ' · 下次预约时间：' + (h['下次预约时间'] || '待定') + ' · 登场：' + (h['登场人数'] || '单人'),
      '当前：' + pget(stat, '世界.当前日期', '') + ' ' + pget(stat, '世界.当前时间段', '') + ' · ' + pget(stat, '世界.当前场景', ''),
      '接下来以她为目标。',
      '（本段由状态栏自动填入，可修改补充；以你发送的内容为准）'
    ];
  }

  // ---------- 确认入池 ----------
  function onConfirm() {
    var btn = $('confirm');
    if (btn) { btn.disabled = true; btn.textContent = '写入中…'; }
    tip('');
    if (MODE !== 'generator' && sel.heroes.some(function (h) { return h.existing; })) {
      if (!window.confirm('重新入池会覆盖当前花名册与全部进度，确定继续？')) {
        if (btn) { btn.disabled = false; btn.textContent = '更新入池（覆盖现有进度）'; }
        return;
      }
    }
    var harem = buildHarem();
    var firstName = sel.heroes.length ? sel.heroes[0].name : '';
    var phase = (MODE === 'generator') ? '深耕' : null;
    writeStat(harem, firstName, phase).then(function () {
      if (MODE === 'generator') {
        var desc = sel.heroes.map(function (h) {
          return h.name + '（' + h.type + '·' + h.identity + '，' + h.age + '岁，' + h.body + '，外' + h.outer + '内' + h.inner +
            '，' + h.appoint + '，' + h.time + '，' + h.party + '）';
        }).join('；');
        var msg = '今晚入池的三位：' + desc + '。从第一位开始。';
        if (BRIDGE) {
          framePost({ source: 'mxt-frame', type: 'gen', message: msg });
          tip('已写入变量，正在开始第一夜…');
          switchMode('bar');
        } else if (createChatMessages) {
          createChatMessages([{ role: 'user', message: msg }]).then(function () {
            if (triggerSlash) triggerSlash('/trigger');
          }).catch(function () { tip('已写入变量，请手动发送一句话让 AI 开始第一夜。'); });
        } else {
          tip('已写入变量。请手动发送一句话让 AI 开始第一夜。');
        }
      } else {
        prefill(rosterLines(), '已更新花名册并填入输入栏，可修改后发送');
        if (btn) { btn.disabled = false; btn.textContent = '更新入池（覆盖现有进度）'; }
      }
    }).catch(function (err) {
      tip('写入失败：' + (err && err.message ? err.message : err));
      if (btn) { btn.disabled = false; btn.textContent = (MODE === 'generator') ? '确认入池' : '更新入池（覆盖现有进度）'; }
    });
  }

  // ---------- 紧凑栏 ----------
  function barRender() {
    if (MODE !== 'bar') return;
    readStat().then(function (stat) {
      if (!stat) {
        $('date').textContent = '等待楼层环境…（与 AI 对话一轮后此处显示）';
        return;
      }
      $('date').textContent = pget(stat, '世界.当前日期', '--');
      $('time').textContent = pget(stat, '世界.当前时间段', '--');
      $('scene').textContent = pget(stat, '世界.当前场景', '--');
      $('phase').textContent = pget(stat, '剧情.剧情阶段', '--');
      var name = pget(stat, '世界.当前女主', '') || '未定';
      $('hero').textContent = name;
      var h = (pget(stat, '后宫', {}) || {})[name];
      if (h) {
        var aff = h['好感度'] || 0;
        $('stage').textContent = stageOf(aff);
        setBar($('affNum'), $('affFill'), aff);
        setBar($('lustNum'), $('lustFill'), h['性欲'] || 0);
      } else {
        $('stage').textContent = '';
        setBar($('affNum'), $('affFill'), 0);
        setBar($('lustNum'), $('lustFill'), 0);
      }
    });
  }

  // ---------- 人物记录（折叠档案 + 只读 + 设为目标） ----------
  var rec = { current: null, open: false, expanded: {} };
  function recRender() {
    readStat().then(function (stat) {
      var box = $('recBody');
      if (!box) return;
      if (!stat) { box.innerHTML = '<div class="empty">等待楼层环境…（与 AI 对话一轮后此处显示）</div>'; return; }
      var harem = pget(stat, '后宫', {}) || {};
      var names = Object.keys(harem);
      var curName = pget(stat, '世界.当前女主', '');
      if (!names.length) { box.innerHTML = '<div class="empty">花名册还是空的。第一夜开局时选定的三位会记在这里。</div>'; return; }
      if (!rec.current || !harem[rec.current]) rec.current = names[0];

      var html = '<div class="list">';
      names.forEach(function (n) {
        html += '<span class="tab' + (n === rec.current ? ' on' : '') + '" data-n="' + esc(n) + '">' + esc(n) +
          (n === curName ? '<span class="cur">当前</span>' : '') + '</span>';
      });
      html += '</div>';

      var h = harem[rec.current] || {};
      var kinks = h['性癖'] || [];
      var aff = h['好感度'] || 0;
      var isOpen = !!rec.expanded[rec.current];
      var brief = esc((h['身份'] || '')) + ' · ' + esc(h['预约类型'] || '到店') + ' · 下次预约 ' + esc(h['下次预约时间'] || '待定');
      html += '<div class="profile">' +
        '<div class="psum" data-act="toggle">' +
        '<span class="pname">' + esc(rec.current) + '</span>' +
        '<span class="pstage">' + stageOf(aff) + '</span>' +
        '<span class="pbrief">' + brief + '</span>' +
        '<span class="pexpand">' + (isOpen ? '收起 ▴' : '展开档案 ▾') + '</span>' +
        '</div>' +
        '<div class="pdetail' + (isOpen ? ' open' : '') + '">' +
        '<div class="row"><b>身份</b> · ' + esc(h['身份'] || '') + '　<b>年龄</b> · ' + esc(h['年龄'] || '') + ' 岁</div>' +
        '<div class="row"><b>身材</b> · ' + esc(h['身材'] || '') + '</div>' +
        '<div class="row"><b>性格</b> · 外 ' + esc(h['外在性格'] || '') + ' × 内 ' + esc(h['内在性格'] || '') + '</div>' +
        '<div class="row"><b>预约类型</b> · ' + esc(h['预约类型'] || '到店') + '　<b>下次预约时间</b> · ' + esc(h['下次预约时间'] || '待定') + '　<b>登场</b> · ' + esc(h['登场人数'] || '单人') + '</div>' +
        '<div class="rbar"><div class="lab"><span>好感度</span><span>' + aff + ' / 100</span></div><div class="track"><div class="fill" style="width:' + Math.max(0, Math.min(100, aff)) + '%"></div></div></div>' +
        '<div class="rbar"><div class="lab"><span>性欲</span><span>' + (h['性欲'] || 0) + ' / 100</span></div><div class="track"><div class="fill lust" style="width:' + Math.max(0, Math.min(100, h['性欲'] || 0)) + '%"></div></div></div>' +
        '<div class="row kinks"><b>已解锁性癖</b></div><div>' +
        (kinks.length ? kinks.map(function (k) { return '<span class="chip">' + esc(k) + '</span>'; }).join('') : '<span class="chip">尚未解锁</span>') +
        '</div>' +
        '<span class="targetbtn" data-target="' + esc(rec.current) + '">设为目标 · 填入输入栏</span>' +
        '</div></div>';

      var logs = pget(stat, '剧情.对局日志', []) || [];
      html += '<div class="log"><div class="lt">对局日志</div>';
      if (!logs.length) {
        html += '<div class="logItem">还没有记录。</div>';
      } else {
        logs.slice().reverse().forEach(function (it) {
          html += '<div class="logItem"><span class="d">' + esc(pget(it, '日期', '')) + '</span>' +
            '<span class="s">' + esc(pget(it, '场景', '')) + '</span>' + esc(pget(it, '事件', '')) + '</div>';
        });
      }
      html += '</div>';
      box.innerHTML = html;
    });
  }
  function bindRec() {
    var box = $('recBody');
    if (!box) return;
    box.addEventListener('click', function (e) {
      var el = e.target;
      if (!el.getAttribute) return;
      var n = el.getAttribute('data-n');
      if (n) { rec.current = n; recRender(); return; }
      if (el.getAttribute('data-act') === 'toggle') {
        rec.expanded[rec.current] = !rec.expanded[rec.current];
        recRender(); return;
      }
      var t = el.getAttribute('data-target');
      if (t) {
        readStat().then(function (stat) {
          var h = (pget(stat, '后宫', {}) || {})[t];
          if (!h) return;
          prefill(targetLines(t, h, stat || {}), '已把「' + t + '」的信息填入输入栏，可修改后发送，以你发送的为准');
        });
      }
    });
  }

  // ---------- 面板折叠 ----------
  function bindPanels() {
    $('headSel').addEventListener('click', function () {
      var body = $('bodySel'), head = $('headSel');
      var open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      head.textContent = (open ? '▸' : '▾') + ' 人物选择器';
      if (!open) selInit();
    });
    $('headRec').addEventListener('click', function () {
      var body = $('bodyRec'), head = $('headRec');
      var open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      head.textContent = (open ? '▸' : '▾') + ' 人物记录';
      rec.open = !open;
      if (!open) recRender();
    });
    $('switchBtn').addEventListener('click', function () {
      var body = $('bodyRec');
      if (body.style.display === 'none') {
        body.style.display = 'block';
        $('headRec').textContent = '▾ 人物记录';
        rec.open = true;
        recRender();
      }
    });
  }

  // ---------- 模式切换（generator 开场选人 / bar 常驻状态栏） ----------
  function switchMode(mode) {
    if (mode !== 'generator' && mode !== 'bar') return;
    if (mode === MODE && sel.inited) return;
    MODE = mode;
    $('genMode').style.display = (mode === 'generator') ? 'block' : 'none';
    $('barMode').style.display = (mode === 'bar') ? 'block' : 'none';
    if (mode === 'generator') {
      sel.inited = false;
      bindSelContainer($('genSel'));
      selInit();
    } else {
      bindSelContainer($('barSel'));
      bindPanels();
      bindRec();
      barRender();
      recRender();
    }
    reportHeight();
  }

  // ---------- 高度同步（桥接模式下让父容器撑开 iframe） ----------
  var lastH = 0;
  function reportHeight() {
    if (!BRIDGE) return;
    var h = document.body.scrollHeight;
    if (h && Math.abs(h - lastH) > 4) {
      lastH = h;
      framePost({ source: 'mxt-frame', type: 'height', h: h });
    }
  }

  // ---------- 启动 ----------
  if (BRIDGE) {
    // 常驻模式：向父页面桥接询问当前应有模式（开场白期间为 generator）
    framePost({ source: 'mxt-frame', type: 'mode?' });
    setTimeout(function () {
      if (!sel.inited) switchMode('bar');
    }, 1500);
  } else {
    switchMode(window.__MXT_MODE__ || 'bar');
  }
  setInterval(function () {
    if (MODE === 'bar') {
      barRender();
      if (rec.open) recRender();
    }
    reportHeight();
  }, 2000);
})();
</script>
</body>
</html>
