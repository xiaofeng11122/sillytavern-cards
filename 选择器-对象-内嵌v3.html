  /* ---------- 第十五轮：自洽引擎 + 联动权重 ----------
   * figRule：人体工学约束——先定骨相，再定肉相，胸臀腿腰跟着肉相走，
   *   触感跟肤色走、印记跟肉相走、步态跟站姿与骨相走；一维定了，下一维只在允许的池里抽。
   * fetLink：身材 → 性癖 的偏好权重（娇小→臣服/被动↑、主导↓；宽大厚重→主导↑↑ …）。
   * ------------------------------------------------------------------------ */
  function keyOf(v) { return String(v || '').split('（')[0]; }
  function ruleOf(tbl, k) {
    if (!tbl || !k) return null;
    k = keyOf(k);
    var v = tbl[k]; if (v != null && v.length) return v;
    for (var kk in tbl) { if (keyOf(kk) === k) return tbl[kk]; }
    return null;
  }
  function orFull(a, b) { return (a && a.length) ? a : b; }
  function both(a, b) {
    if (!a || !a.length) return (b && b.length) ? b : [];
    if (!b || !b.length) return a;
    var o = [], i;
    for (i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) o.push(a[i]);
    if (o.length) return o;
    /* 两边约束打架（理论上不该发生）：退化为并集，交给上层 orFull 兜底 */
    var u = a.slice(), j;
    for (j = 0; j < b.length; j++) if (u.indexOf(b[j]) < 0) u.push(b[j]);
    return u;
  }
  function wpick(arr, w) {
    if (!arr || !arr.length) return '';
    var ws = [], tot = 0, i, x;
    for (i = 0; i < arr.length; i++) {
      x = (w && (w[arr[i]] != null ? w[arr[i]] : w[keyOf(arr[i])]));
      if (x == null) x = 1;
      ws.push(x); tot += x;
    }
    var r = Math.random() * tot;
    for (i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
    return arr[arr.length - 1];
  }
  function figRoll() {
    var R = P.figRule, r = {};
    r.f_bone = rnd(P.figBone);
    r.f_flesh = rnd(orFull(ruleOf(R.bone2flesh, r.f_bone), P.figFlesh));
    r.f_waist = rnd(orFull(ruleOf(R.flesh2waist, r.f_flesh), P.figWaist));
    r.f_bust = rnd(orFull(ruleOf(R.flesh2bust, r.f_flesh), P.figBust));
    r.f_hip = rnd(orFull(ruleOf(R.flesh2hip, r.f_flesh), P.figHip));
    r.f_legs = rnd(orFull(both(ruleOf(R.flesh2legs, r.f_flesh), ruleOf(R.bone2legs, r.f_bone)), P.figLegs));
    r.f_tone = rnd(P.figTone);
    r.f_touch = rnd(orFull(ruleOf(R.tone2touch, r.f_tone), P.figTouch));
    r.f_mark = rnd(orFull(ruleOf(R.flesh2mark, r.f_flesh), P.figMark));
    r.f_hair = rnd(P.figHair);
    r.f_body = rnd(P.figBody);
    r.f_stand = rnd(P.figStand);
    r.f_walk = rnd(orFull(both(ruleOf(R.stand2walk, r.f_stand), ruleOf(R.bone2walk, r.f_bone)), P.figWalk));
    r.f_micro = rnd(P.figMicro);
    r.f_wear = rnd(P.figWear);
    return r;
  }
  function fetRoll() {
    var L = P.fetLink, b = keyOf(val('f_bone')), f = keyOf(val('f_flesh'));
    function w(dim) {
      var m = {}, src = [(L.bone || {})[b], (L.flesh || {})[f]], i, k;
      for (i = 0; i < src.length; i++) {
        var s = src[i];
        if (s && s[dim]) for (k in s[dim]) m[k] = (m[k] || 1) * s[dim][k];
      }
      return m;
    }
    return { f_sen: wpick(P.fetSen, w('sen')), f_pow: wpick(P.fetPow, w('pow')),
             f_psy: wpick(P.fetPsy, w('psy')), f_scene: wpick(P.fetScene, w('scene')),
             f_lose: wpick(P.fetOut, w('lose')), f_weak: wpick(P.fetWeak, w('weak')) };
  }
  function figFill() { var r = figRoll(), k; for (k in r) setv(k, r[k]); syncSum(); }
  function fetFill() { var r = fetRoll(), k; for (k in r) setv(k, r[k]); syncSum(); }
  var FIG_K = ['f_bone', 'f_flesh', 'f_bust', 'f_hip', 'f_legs', 'f_waist', 'f_tone', 'f_touch', 'f_mark', 'f_hair', 'f_body', 'f_stand', 'f_walk', 'f_micro', 'f_wear'];
  var FET_K = ['f_sen', 'f_pow', 'f_psy', 'f_scene', 'f_lose', 'f_weak', 'f_taboo'];
  function syncSum() {
    var i, v, a = [], b = [], e;
    for (i = 0; i < FIG_K.length; i++) { v = val(FIG_K[i]); if (v) a.push(keyOf(v)); }
    for (i = 0; i < FET_K.length; i++) { v = val(FET_K[i]); if (v) b.push(keyOf(v)); }
    e = document.getElementById('sgFigSum'); if (e) e.textContent = a.length ? a.join('·') : '（未指定，交给 AI 抽）';
    e = document.getElementById('sgFetSum'); if (e) e.textContent = b.length ? b.join('｜') : '（留空＝隐藏待探）';
  }

  })();
  o.figure = val('c_figure') || (function(){
    var dims=[['骨相',val('f_bone')],['肉相',val('f_flesh')],['胸',val('f_bust')],['臀',val('f_hip')],['腿',val('f_legs')],
              ['腰腹',val('f_waist')],['肤色',val('f_tone')],['触感',val('f_touch')],['印记',val('f_mark')],
              ['头发',val('f_hair')],['体毛',val('f_body')],['站姿',val('f_stand')],['步态',val('f_walk')],
              ['微表情',val('f_micro')],['穿衣',val('f_wear')]];
    var got=[];
    for(var i=0;i<dims.length;i++){ if(dims[i][1]) got.push(dims[i][0]+'：'+dims[i][1]); }
    if(!got.length) return '';
    return got.join('；')+'（按黄金公式 [骨相]＋[肉相]＋[胸臀腿腰特写]＋[皮相]＋[毛发]＋[体态]＋[穿衣] '
      + '拼成一段 80–160 字白描，十五处须自洽（骨感无肉不得配夸张巨乳／丰满肉浪，妊娠纹不得配骨感类），'
      + '❌ 不得输出孤立标签或「A×B×C」罗列）';
  })();
  o.fetish = val('c_fetish') || (function(){
    var dims=[['感官',val('f_sen')],['权力',val('f_pow')],['心理',val('f_psy')],['场景',val('f_scene')],
              ['失控',val('f_lose')],['攻破点',val('f_weak')],['雷区',val('f_taboo')]];
    var got=[];
    for(var i=0;i<dims.length;i++){ if(dims[i][1]) got.push(dims[i][0]+'：'+dims[i][1]); }
    if(!got.length) return '';
    return got.join('｜')+'（按黄金公式 [感官]＋[权力]＋[心理]＋[场景]＋[失控表现]＋[攻破点]（＋雷区，可无）'
      + '拼成一段 80–160 字欲望剧本，写清她为何而动、何时失守、失守时什么样子、哪一处一碰就塌；'
      + '攻破点须逐次暗示，❌ 不得开局点破；❌ 不得罗列标签）';
  })();
  o.sensitive = val('c_sensitive') || (function(){
    var a=val('f_sensMain'),b=val('f_sensSub'); return (a&&b)?('主：'+a+'｜次：'+b):'';
  })();
  return o;
}
var NAMES=['身份','年龄','性格','身材','性癖','敏感点'];
var KEYS=['identity','age','personality','figure','fetish','sensitive'];
/* 留空项的呈报口径：性格/性癖/敏感点不填，不是「缺失」，而是「交给 AI 内部处理」；
   性癖／敏感点＝AI 内部真值，【目标卡】照常写全真值并附探知标记，只是正文按主角认知分寸推进 */
var BLANK_WORD={
  personality:'未指定（请你按身份与家世自选「外在」「内在」各一词，各展开成一句行为描写）',
  fetish:'未指定（你内部自行设定真值即可；【目标卡】照常写全真值并附探知标记，正文按主角认知分寸推进）',
  sensitive:'未指定（你内部自行设定真值即可，按部位表抽主／次各一处；【目标卡】照常写全真值并附探知标记，正文按主角认知分寸推进）'
};
function toParts(o){
  var p=[];
  for(var i=0;i<KEYS.length;i++){
    var v=o[KEYS[i]]||'';
    if(!v && BLANK_WORD[KEYS[i]]) v=BLANK_WORD[KEYS[i]];
    p.push(NAMES[i]+'='+v);
  }
  var li=liveInfo(); if(li.live) p.push('居所='+li.live.split('（')[0]);
  return p.join('｜');
}
/* 硬必填只有三项：身份、年龄、身材——看得见的部分 */
function check(o){
  var MUST={'身份':1,'年龄':1,'身材':1};
  for(var i=0;i<KEYS.length;i++){
    if(!o[KEYS[i]] && MUST[NAMES[i]]) return '「'+NAMES[i]+'」尚未填写，请补全。';
  }
  var age=o.age;
  if(age&&(parseInt(age)<18||parseInt(age)>50||isNaN(parseInt(age)))) return '年龄必须在 18–50 之间。';
  var c=curCat();
  if(c==='宗室皇亲'&&val('z_rel')==='宗室女'&&(!val('z_rank')||!val('z_marry'))) return '宗室女需选爵级与婚否。';
  if(c==='宗室皇亲'&&val('z_rel')==='宗室妇'&&!val('z_wife')) return '宗室妇需选封号。';
  return '';
}
function randomAll(){
  emptyAll();
  var c=rnd(P.cat); setv('idCat',c); onCat();
  if(c==='宗室皇亲'){
    var rel=(Math.random()<0.62)?'宗室女':'宗室妇'; setv('z_rel',rel); onZRel();
    if(rel==='宗室女'){ var r=rnd(P.zRank),m=rnd(P.zMarry); setv('z_rank',r); setv('z_marry',m); }
    else { setv('z_wife',rnd(P.zWife)); }
  } else if(c==='朝官家眷'){
    var gr=rnd(P.guanRank); setv('g_rank',gr); fillOffices();
    setv('g_office',rnd(P.guanOffice[gr])); setv('g_pos',rnd(allPos()));
  } else if(c==='外官家眷'){
    setv('w_office',rnd(P.waiOffice)); setv('w_place',rnd(P.waiPlace)); setv('w_pos',rnd(allPos()));
  } else if(c==='世家女眷'){
    var nr=rnd(P.rank); setv('idRank',nr); fillHouses();
    setv('idHouse',rnd(P.houses[nr])); setv('idPos',rnd(allPos()));
  } else {
    setv('n_bureau',rnd(P.bureau)); setv('n_duty',rnd(P.duty));
  }
  suggestAge();
  /* 性格：随机给一组词（外在／内在），卡面仍由 AI 各自展开成行为句 */
  var pa=persAll(); setv('f_out',rnd(pa)); setv('f_inn',rnd(pa));
  /* 身材：十五维按自洽硬表生成（骨感无肉不会配夸张巨乳，站姿与步态不打架） */
  var fgr=figRoll(), fgk; for(fgk in fgr) setv(fgk,fgr[fgk]);
  /* 性癖：六维按身材联动权重生成（娇小→臣服/被动↑、主导↓；宽大厚重→主导↑↑） */
  var ftr=fetRoll(), ftk; for(ftk in ftr) setv(ftk,ftr[ftk]);
  setv('f_taboo','');
  /* 敏感点：一律留空＝隐藏待探（真值由 AI 内部设定，玩家自己探） */
  setv('f_sensMain',''); setv('f_sensSub','');
  syncSum();
  showLive();
}
function boxToggle(id,btn){
  var b=el(id); if(!b) return;
  var open=b.style.display!=='none';
  b.style.display=open?'none':'block';
  if(btn) btn.textContent=open?'展开细选 ▾':'收起细选 ▴';
}
function hintSay(t){ var h=el('sgHint'); if(h) h.textContent=t; }
function bindFields(){
  var c=el('idCat'); if(c) c.onchange=onCat;
  var z=el('z_rel'); if(z) z.onchange=onZRel;
  /* 联动下拉：既要重填子选项，也要刷新居所预览与年龄建议 */
  var gr=el('g_rank'); if(gr) gr.onchange=function(){ fillOffices(); suggestAge(); showLive(); };
  var nr=el('idRank'); if(nr) nr.onchange=function(){ fillHouses(); suggestAge(); showLive(); };
  ['g_pos','w_pos','idPos','z_rank','z_marry','z_wife',
   'g_office','w_office','w_place','idHouse','n_bureau','n_duty']
    .forEach(function(k){ var e=el(k); if(e) e.onchange=function(){ suggestAge(); showLive(); }; });
  /* 第十五轮：身材／性癖 的一键生成与展开细选 */
  FIG_K.concat(FET_K).forEach(function(k){ var e=el(k); if(e) e.onchange=function(){ syncSum(); }; });
  var fr=el('sgFigRoll'); if(fr) fr.onclick=function(){ figFill(); hintSay('身材已按自洽约束一键生成（十五处互不打架）。'); };
  var fm=el('sgFigMore'); if(fm) fm.onclick=function(){ boxToggle('sgFigBox',fm); };
  var er=el('sgFetRoll'); if(er) er.onclick=function(){ fetFill(); hintSay('性癖已按身材联动权重一键生成（含攻破点）。'); };
  var em=el('sgFetMore'); if(em) em.onclick=function(){ boxToggle('sgFetBox',em); };
  syncSum();
}

document.getElementById('sgFields').innerHTML=buildFields('sg-field','sg-');
bindFields();
document.getElementById('sgRand').onclick=function(){
  randomAll();
  hintSay('已随机填充：身材按自洽约束生成，性癖按身材联动权重生成（探知标记仍从「未露」起步）；敏感点留空＝隐藏待探。');
};
document.getElementById('sgStart').onclick=function(){
  var o=collect(); var err=check(o);
  var hint=document.getElementById('sgHint');
  if(err){ hint.textContent=err; return; }
  var t='【生成目标｜自定义：'+toParts(o)+'】';
  function slash(cmd){
    return new Promise(function(res,rej){
      try{
        if(typeof triggerSlash==='function'){ var p=triggerSlash(cmd); if(p&&p.then){p.then(res,rej);}else{res();} return; }
        if(window.TavernHelper&&typeof TavernHelper.triggerSlash==='function'){ var p2=TavernHelper.triggerSlash(cmd); if(p2&&p2.then){p2.then(res,rej);}else{res();} return; }
        if(window.SillyTavern&&typeof SillyTavern.getContext==='function'){ var c=SillyTavern.getContext(); if(c&&typeof c.executeSlashCommands==='function'){ var p3=c.executeSlashCommands(cmd); if(p3&&p3.then){p3.then(res,rej);}else{res();} return; } }
        rej(new Error('未检测到酒馆助手接口'));
      }catch(e){ rej(e); }
    });
  }
  hint.textContent='生成中…';
  slash('/send '+t).then(function(){
    setTimeout(function(){
      slash('/trigger').then(function(){ hint.textContent='✓ 已重新生成，AI 正在回应…'; }).catch(function(){ hint.textContent='⚠ 触发失败，请手动发送：'+t; });
    },700);
  }).catch(function(e){ hint.textContent='⚠ 发送失败：'+e; });
};
document.getElementById('sgTheme').onclick=function(){
  var r=document.getElementById('root'); r.classList.toggle('light');
  this.textContent= r.classList.contains('light')?'☀️':'🌙';
};
})();
</script>
