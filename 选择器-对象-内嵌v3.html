<div id="root" class="sg-root">
<style>
.sg-root{
  --sg-panel:#1f1b2e; --sg-fg:#e9e6f5; --sg-muted:#9b94b8; --sg-accent:#7F77DD; --sg-border:rgba(136,136,136,.35);
  color:var(--sg-fg); font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif; font-size:15px;
}
.sg-root.light{ --sg-panel:#ffffff; --sg-fg:#22202c; --sg-muted:#6b6580; --sg-border:rgba(0,0,0,.15); }
.sg-root *{box-sizing:border-box;}
.sg-top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
.sg-tbtn{border:1px solid var(--sg-border);background:var(--sg-panel);color:var(--sg-fg);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;}
.sg-card{background:var(--sg-panel);border:1px solid var(--sg-border);border-radius:12px;padding:14px;}
.sg-field{margin:12px 0;}
.sg-field>label{display:block;font-size:14px;font-weight:600;margin-bottom:4px;}
.sg-sub{font-size:12px;color:var(--sg-muted);margin:0 0 6px;}
.sg-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.sg-row .sg-mini{font-size:12px;color:var(--sg-muted);min-width:44px;flex:none;}
.sg-row select{flex:1;min-width:0;}
.sg-root input[type=text],.sg-root input[type=number],.sg-root select{width:100%;padding:7px;border-radius:8px;border:1px solid var(--sg-border);background:var(--sg-panel);color:var(--sg-fg);font-size:14px;}
.sg-root select option,.sg-root optgroup{background:var(--sg-panel);color:var(--sg-fg);}
.sg-cust{font-size:12px;color:var(--sg-muted);margin-top:4px;}
.sg-live{font-size:12.5px;line-height:1.55;margin:8px 0 2px;padding:8px 10px;border-radius:8px;
  border:1px dashed rgba(127,119,221,.55);background:rgba(127,119,221,.10);color:var(--sg-fg);}
.sg-live b{color:#b9b1ff;}
.sg-root.light .sg-live b{color:#5b52c9;}
.sg-live .warn{color:#e07b7b;font-weight:600;}
.sg-live .ok{color:#6ec98a;font-weight:600;}
.sg-random{display:block;width:100%;background:var(--sg-accent);color:#fff;border:none;border-radius:9px;padding:10px 12px;cursor:pointer;font-size:14px;margin:12px 0 4px;}
.sg-hint{font-size:12px;color:#e07b7b;min-height:16px;margin-top:6px;}
.sg-start{width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;font-size:14px;color:#fff;background:linear-gradient(90deg,#7F77DD,#b06ab3);}
</style>

/* 主母位（按身份判定） */
function motherOf(cat,pos,rel,rank){
  if(cat==='宫廷女官') return '掌事姑姑（本局尚宫／司正）';
  if(cat==='宗室皇亲'){
    if(rel==='宗室妇') return '太妃（夫之母）或先王妃';
    return rank==='公主'&&docMarry()==='已嫁' ? '婆母（居公主府则由家令司掌事代行内宅之事）' : '母妃（亲王正妃／皇后）或其嫡母';
  }
  if(!pos) return '—';
  if(P.posSYS['妻媳系'].indexOf(pos)>=0) return '婆母（现任家主正妻）';
  if(P.posSYS['妾婢系'].indexOf(pos)>=0) return '主母（夫之正妻）';
  return '嫡母（生母或父之正妻），另附生母（若为庶出）';
}

/* ================= 工具 ================= */
function opts(a){var s='';for(var i=0;i<a.length;i++){s+='<option value="'+a[i]+'">'+a[i]+'</option>';}return s;}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function el(id){return document.getElementById(id);}
function val(id){var e=el(id);return e?String(e.value).trim():'';}
function setv(id,v){var e=el(id);if(e)e.value=v;}
function allPos(){return P.posSYS['未嫁系'].concat(P.posSYS['妻媳系'],P.posSYS['妾婢系']);}
function docMarry(){return val('z_marry')||'未嫁';}
function emptyAll(){['c_identity','c_age','c_ess','c_fac','c_figure','c_fetish','c_sensitive'].forEach(function(k){setv(k,'');});}
function driveName(v){return String(v||'').split('（')[0];}
function updateShapeHint(){
  var box=el('shapeHint'); if(!box) return;
  var v=val('f_shape');
  box.innerHTML=(v&&P.shapeNote[v])?('<b>'+v+'</b>　'+P.shapeNote[v]+'　<span style="opacity:.75">（卡面由 AI 展开成白描句）</span>'):'— 选择原型后，此处显示它的骨相要点 —';
}

  h+='<p class="'+p+'sub">想手打身份就填这里，会覆盖上面的选择。建议按「家族＋位分」或「爵级＋婚否」的写法。</p>';
  h+='<input type="text" id="c_identity" placeholder="如：镇北侯府守节媳 / 已嫁公主 / 扬州知府之庶女"></div>';

  /* 年龄 */
  h+='<div class="'+cls+'"><label>年龄</label>';
  h+='<p class="'+p+'sub">半绑定：按身份给建议区间，允许小幅溢出（±3 岁内）。</p>';
  h+='<input type="number" id="f_age" min="18" max="50" placeholder="18–50">';
  h+='<div class="'+p+'cust">或自定义：<input type="text" id="c_age" placeholder="手打年龄"></div></div>';

  /* 性格 */
  h+='<div class="'+cls+'"><label>性格</label><p class="'+p+'sub">本质（心里真正要的／怕的）＋ 外在（给人看的样子），各一句行为描写。<b>留空则由 AI 按身份家世自定。</b></p>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">本质</span><select id="f_ess"><option value="">— 不指定 —</option>'+opts(P.essTone)+'</select></div>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">外在</span><select id="f_fac"><option value="">— 不指定 —</option>'+opts(P.facShow)+'</select></div>';
  h+='<div class="'+p+'cust">或手打本质：<input type="text" id="c_ess" placeholder="如：怕被人丢下，凡事都抢在前头做"></div>';
  h+='<div class="'+p+'cust">或手打外在：<input type="text" id="c_fac" placeholder="如：人前总是先笑，话说三分就收"></div></div>';

  /* 身材 */
  h+='<div class="'+cls+'"><label>身材 <span style="font-weight:400;color:var(--sg-muted);font-size:12px;">（选身形原型）</span></label><p class="'+p+'sub">选一个 <b>身形原型</b>——同一原型内的骨相是配套的，不会抽出「骨瘦如柴却胸前丰盈」这种自相矛盾。卡面由 AI 展开成 <b>1–2 句白描</b>，不会写成词条清单。</p>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">原型</span><select id="f_shape"><option value="">— 请选择 —</option>'+opts(P.shape)+'</select></div>';
  h+='<div id="shapeHint" style="font-size:12px;color:var(--sg-muted);line-height:1.55;margin:2px 0 6px;">— 选择原型后，此处显示它的骨相要点 —</div>';
  h+='<div class="'+p+'cust">或直接手打整句：<input type="text" id="c_figure" placeholder="如：身量五尺三四，身姿薄直，肩薄锁骨清浅…"></div></div>';

  /* 性癖 */
  h+='<div class="'+cls+'"><label>性癖 <span style="font-weight:400;color:var(--sg-muted);font-size:12px;">（可留空）</span></label><p class="'+p+'sub">这是给 <b>AI 的内部设定</b>，只用来保持描写一致。<b>留空＝隐藏待探</b>：卡片上照常把真值写给你看，但戏里那个采花贼开局不会知道。</p>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">主</span><select id="f_fetMain"><option value="">— 隐藏待探 —</option>'+opts(P.fetDrive)+'</select></div>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">次</span><select id="f_fetSub"><option value="">— 不填 —</option>'+opts(P.fetDrive)+'</select></div>';
  h+='<div class="'+p+'cust">或手打（留空即隐藏待探）：<input type="text" id="c_fetish" placeholder="不填最好，留给探索"></div></div>';

  /* 敏感点 */
  h+='<div class="'+cls+'"><label>敏感点 <span style="font-weight:400;color:var(--sg-muted);font-size:12px;">（可留空）</span></label><p class="'+p+'sub">同样只是 <b>AI 的内部设定</b>。<b>留空＝隐藏待探</b>——卡片上照常把真值写给你看，不等于戏里那个采花贼知道。</p>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">主</span><select id="f_sensMain"><option value="">— 隐藏待探 —</option><optgroup label="表露">'+opts(P.sensBody)+'</optgroup><optgroup label="私处">'+opts(P.sensSex)+'</optgroup><optgroup label="深处">'+opts(P.sensDeep)+'</optgroup></select></div>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">次</span><select id="f_sensSub"><option value="">— 不填 —</option><optgroup label="表露">'+opts(P.sensBody)+'</optgroup><optgroup label="私处">'+opts(P.sensSex)+'</optgroup><optgroup label="深处">'+opts(P.sensDeep)+'</optgroup></select></div>';
  h+='<div class="'+p+'cust">或手打（留空即隐藏待探）：<input type="text" id="c_sensitive" placeholder="不填最好，留给探索"></div></div>';
  return h;
}

/* ================= 交互 ================= */
function curCat(){return val('idCat');}
function fillOffices(){
  var r=val('g_rank'),s=el('g_office'); if(!s) return;
  var list=(r&&P.guanOffice[r])?P.guanOffice[r]:[];
  s.innerHTML='<option value="">'+(r?'— 请选择 —':'— 请先选品级 —')+'</option>'+opts(list);
}
function fillHouses(){
  var r=val('idRank'),s=el('idHouse'); if(!s) return;
  var list=(r&&P.houses[r])?P.houses[r]:[];
  s.innerHTML='<option value="">'+(r?'— 请选择 —':'— 请先选门第 —')+'</option>'+opts(list);
}
function onCat(){
  var c=curCat();
  [['grpZong','宗室皇亲'],['grpGuan','朝官家眷'],['grpWai','外官家眷'],['grpNoble','世家女眷'],['grpNy','宫廷女官']]
    .forEach(function(x){ var g=el(x[0]); if(g) g.style.display=(c===x[1])?'block':'none'; });
  showLive();
}
function onZRel(){
  var r=val('z_rel');
  var a=el('zNv'),b=el('zFu');
  if(a) a.style.display=(r==='宗室女')?'block':'none';
  if(b) b.style.display=(r==='宗室妇')?'block':'none';
  showLive();
}
/* 身份串 */
function identity(){
  var c=curCat();
  if(c==='宗室皇亲'){
    if(val('z_rel')==='宗室妇') return val('z_wife');
    var r=val('z_rank'),m=val('z_marry');
    return (r&&m)?(m+r):'';
  }
  if(c==='朝官家眷'){ var a=val('g_rank'),b=val('g_office'),p=val('g_pos'); return (a&&b&&p)?(a+b+'之'+p):''; }
  if(c==='外官家眷'){ var a2=val('w_place'),b2=val('w_office'),p2=val('w_pos'); return (b2&&p2)?((a2||'')+b2+'之'+p2):''; }
  if(c==='世家女眷'){ var h=val('idHouse'),p3=val('idPos'); return (h&&p3)?(h+p3):''; }
  if(c==='宫廷女官'){ var bu=val('n_bureau'),du=val('n_duty'); return (bu&&du)?(bu+du):''; }
  return '';
}
/* 居所预览 */
function liveInfo(){
  var c=curCat(),out={live:'',zone:'',mz:'',pos:''};
  if(c==='宗室皇亲'){
    if(val('z_rel')==='宗室妇'){ var w=val('z_wife'); out.live=P.zWifeLive[w]||''; out.zone='A2 王府'; out.mz=motherOf(c,'','宗室妇',''); }
    else{ var r=val('z_rank'),m=val('z_marry'); if(r&&m){ out.live=P.zLive[r+'|'+m]||''; out.zone=P.zZone[r+'|'+m]||''; out.mz=motherOf(c,'','宗室女',r); } }
  } else if(c==='朝官家眷'){
    var gr=val('g_rank'),go=val('g_office'),gp=val('g_pos');
    if(gr) out.live=P.guanHome[gr]||'';
    out.mz=motherOf(c,gp,'','');
  } else if(c==='外官家眷'){
    var wo=val('w_office'),wp=val('w_pos');
    if(wo) out.live=P.waiLive[wo]||'';
    out.mz=motherOf(c,wp,'','');
  } else if(c==='世家女眷'){
    var nr=val('idRank'),nh=val('idHouse'),np=val('idPos');
    if(nr) out.zone=P.nobleZone[nr]||'';
    if(nh) out.live=nh+'（'+(out.zone||'')+'）';
    out.mz=motherOf(c,np,'','');
  } else if(c==='宫廷女官'){
    if(val('n_bureau')){ out.live='内廷·六局廨舍／掖庭偏院（终身居宫中，不得外宿）'; out.zone='A1 宫城'; out.mz='掌事姑姑（本局尚宫／司正）'; }
  }
  return out;
}
function showLive(){
  var box=el('sgLive'); if(!box) return;
  var li=liveInfo();
  if(!li.live && !li.mz){ box.innerHTML='— 选定身份后，此处显示对应的居所与宅制 —'; return; }
  var h='';
  if(li.live) h+='<b>居所：</b>'+li.live;
  if(li.zone) h+='<br><b>宅制：</b>'+li.zone;
  if(li.mz && li.mz!=='—') h+='<br><b>主母位：</b>'+li.mz;
  var id=identity();
  if(id) h+='<br><span class="ok">✓ 身份：「'+id+'」</span>';
  box.innerHTML=h;
}
function suggestAge(){
  var c=curCat(),p='';
  if(c==='世家女眷') p=val('idPos'); else if(c==='朝官家眷') p=val('g_pos'); else if(c==='外官家眷') p=val('w_pos');
  var a=AGE[p];
  if(!a){
    if(c==='宗室皇亲'){
      if(val('z_rel')==='宗室妇') a=[22,45];
      else a=(val('z_marry')==='已嫁')?[20,40]:[18,34];
    } else if(c==='宫廷女官') a=[20,45];
    else if(c==='朝官家眷'||c==='外官家眷') a=[18,32];
  }
  if(a){ setv('f_age',String(a[0]+Math.floor(Math.random()*(a[1]-a[0]+1)))); }
}
function collect(){
  var o={};
  o.identity = val('c_identity') || identity();
  o.age = val('c_age') || val('f_age');
  o.personality = (function(){
    var a=val('c_ess')||val('f_ess'), b=val('c_fac')||val('f_fac');
    if(!a&&!b) return '';
    return '本质：'+(a||'（由你按身份与家世自定一句）')+'；外在：'+(b||'（由你按身份与家世自定一句）');
  })();
  o.figure = val('c_figure') || (function(){
    var s=val('f_shape');
    return s ? (s+'（按该原型的骨相要点展开成 1–2 句白描，❌ 不得把成语堆成「A·B·C」）') : '';
  })();
  o.fetish = val('c_fetish') || (function(){
    var a=driveName(val('f_fetMain')), b=driveName(val('f_fetSub'));
    if(!a) return '';
    return '主：'+a+(b?('｜次：'+b):'');
  })();
  o.sensitive = val('c_sensitive') || (function(){
    var a=val('f_sensMain'),b=val('f_sensSub'); return (a&&b)?('主：'+a+'｜次：'+b):'';
  })();
  return o;
}
var NAMES=['身份','年龄','性格','身材','性癖','敏感点'];
var KEYS=['identity','age','personality','figure','fetish','sensitive'];
/* 留空项的呈报口径：性格/性癖/敏感点不填，不是「缺失」，而是「交给 AI 内部处理」；
   性癖／敏感点＝AI 内部真值，【目标卡】照常写全真值并附探知标记，只是正文按主角认知分寸推进 */
var BLANK_WORD={
  personality:'未指定（请你按身份与家世自定「本质」与「外在」各一句描写）',
  fetish:'未指定（你内部自行设定真值即可；【目标卡】照常写全真值并附探知标记，正文按主角认知分寸推进）',
  sensitive:'未指定（你内部自行设定真值即可，按部位表抽主／次各一处；【目标卡】照常写全真值并附探知标记，正文按主角认知分寸推进）'
};
function toParts(o){
  var p=[];
  for(var i=0;i<KEYS.length;i++){
    var v=o[KEYS[i]]||'';
    if(!v && BLANK_WORD[KEYS[i]]) v=BLANK_WORD[KEYS[i]];
    p.push(NAMES[i]+'='+v);
  }
  var li=liveInfo(); if(li.live) p.push('居所='+li.live.split('（')[0]);
  return p.join('｜');
}
/* 硬必填只有三项：身份、年龄、身材——看得见的部分 */
function check(o){
  var MUST={'身份':1,'年龄':1,'身材':1};
  for(var i=0;i<KEYS.length;i++){
    if(!o[KEYS[i]] && MUST[NAMES[i]]) return '「'+NAMES[i]+'」尚未填写，请补全。';
  }
  var age=o.age;
  if(age&&(parseInt(age)<18||parseInt(age)>50||isNaN(parseInt(age)))) return '年龄必须在 18–50 之间。';
  var c=curCat();
  if(c==='宗室皇亲'&&val('z_rel')==='宗室女'&&(!val('z_rank')||!val('z_marry'))) return '宗室女需选爵级与婚否。';
  if(c==='宗室皇亲'&&val('z_rel')==='宗室妇'&&!val('z_wife')) return '宗室妇需选封号。';
  return '';
}
function randomAll(){
  emptyAll();
  var c=rnd(P.cat); setv('idCat',c); onCat();
  if(c==='宗室皇亲'){
    var rel=(Math.random()<0.62)?'宗室女':'宗室妇'; setv('z_rel',rel); onZRel();
    if(rel==='宗室女'){ var r=rnd(P.zRank),m=rnd(P.zMarry); setv('z_rank',r); setv('z_marry',m); }
    else { setv('z_wife',rnd(P.zWife)); }
  } else if(c==='朝官家眷'){
    var gr=rnd(P.guanRank); setv('g_rank',gr); fillOffices();
    setv('g_office',rnd(P.guanOffice[gr])); setv('g_pos',rnd(allPos()));
  } else if(c==='外官家眷'){
    setv('w_office',rnd(P.waiOffice)); setv('w_place',rnd(P.waiPlace)); setv('w_pos',rnd(allPos()));
  } else if(c==='世家女眷'){
    var nr=rnd(P.rank); setv('idRank',nr); fillHouses();
    setv('idHouse',rnd(P.houses[nr])); setv('idPos',rnd(allPos()));
  } else {
    setv('n_bureau',rnd(P.bureau)); setv('n_duty',rnd(P.duty));
  }
  suggestAge();
  /* 性格：随机给一组构思索引（本质／外在），卡面仍由 AI 展开成两句行为描写 */
  setv('f_ess',rnd(P.essTone)); setv('f_fac',rnd(P.facShow));
  /* 身材：随机给一个身形原型（卡面仍由 AI 展开成白描） */
  setv('f_shape',rnd(P.shape)); updateShapeHint();
  /* 性癖／敏感点：一律留空＝隐藏待探（真值由 AI 内部设定，玩家自己探） */
  setv('f_fetMain',''); setv('f_fetSub','');
  setv('f_sensMain',''); setv('f_sensSub','');
  showLive();
}
function bindFields(){
  var c=el('idCat'); if(c) c.onchange=onCat;
  var z=el('z_rel'); if(z) z.onchange=onZRel;
  var sh=el('f_shape'); if(sh) sh.onchange=updateShapeHint;
  /* 联动下拉：既要重填子选项，也要刷新居所预览与年龄建议 */
  var gr=el('g_rank'); if(gr) gr.onchange=function(){ fillOffices(); suggestAge(); showLive(); };
  var nr=el('idRank'); if(nr) nr.onchange=function(){ fillHouses(); suggestAge(); showLive(); };
  ['g_pos','w_pos','idPos','z_rank','z_marry','z_wife',
   'g_office','w_office','w_place','idHouse','n_bureau','n_duty']
    .forEach(function(k){ var e=el(k); if(e) e.onchange=function(){ suggestAge(); showLive(); }; });
}

document.getElementById('sgFields').innerHTML=buildFields('sg-field','sg-');
bindFields();
document.getElementById('sgRand').onclick=function(){
  randomAll();
  document.getElementById('sgHint').textContent='已随机填充（性癖／敏感点默认留空＝隐藏待探，去戏里自己发掘）。';
};
document.getElementById('sgStart').onclick=function(){
  var o=collect(); var err=check(o);
  var hint=document.getElementById('sgHint');
  if(err){ hint.textContent=err; return; }
  var t='【生成目标｜自定义：'+toParts(o)+'】';
  function slash(cmd){
    return new Promise(function(res,rej){
      try{
        if(typeof triggerSlash==='function'){ var p=triggerSlash(cmd); if(p&&p.then){p.then(res,rej);}else{res();} return; }
        if(window.TavernHelper&&typeof TavernHelper.triggerSlash==='function'){ var p2=TavernHelper.triggerSlash(cmd); if(p2&&p2.then){p2.then(res,rej);}else{res();} return; }
        if(window.SillyTavern&&typeof SillyTavern.getContext==='function'){ var c=SillyTavern.getContext(); if(c&&typeof c.executeSlashCommands==='function'){ var p3=c.executeSlashCommands(cmd); if(p3&&p3.then){p3.then(res,rej);}else{res();} return; } }
        rej(new Error('未检测到酒馆助手接口'));
      }catch(e){ rej(e); }
    });
  }
  hint.textContent='生成中…';
  slash('/send '+t).then(function(){
    setTimeout(function(){
      slash('/trigger').then(function(){ hint.textContent='✓ 已重新生成，AI 正在回应…'; }).catch(function(){ hint.textContent='⚠ 触发失败，请手动发送：'+t; });
    },700);
  }).catch(function(e){ hint.textContent='⚠ 发送失败：'+e; });
};
document.getElementById('sgTheme').onclick=function(){
  var r=document.getElementById('root'); r.classList.toggle('light');
  this.textContent= r.classList.contains('light')?'☀️':'🌙';
};
})();
</script>
