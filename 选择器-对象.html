<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>猎物定制器</title>
<style>
:root{ --bg:#15131f; --panel:#1f1b2e; --fg:#e9e6f5; --muted:#9b94b8; --accent:#7F77DD; --accent2:#5a6b7d; --border:rgba(136,136,136,.35); --fs:15px; }
body.light{ --bg:#f4f3f8; --panel:#ffffff; --fg:#22202c; --muted:#6b6580; --border:rgba(0,0,0,.15); }
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--fg);font-size:var(--fs);padding:10px;}
.wrap{max-width:560px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px;}
.tbtn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.field{margin:12px 0;}
.field > label{display:block;font-size:14px;font-weight:600;margin-bottom:4px;}
.sub{font-size:12px;color:var(--muted);margin:0 0 6px;}
input[type=text],input[type=number],select{width:100%;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--fg);font-size:14px;}
select option{background:var(--panel);color:var(--fg);}
.cust{font-size:12px;color:var(--muted);margin-top:4px;}
.random{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 12px;cursor:pointer;font-size:14px;margin:12px 0 4px;}
.hint{font-size:12px;color:#e07b7b;min-height:16px;margin-top:6px;}
.nav{display:flex;gap:8px;margin-top:12px;}
.btn{width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;font-size:14px;color:#fff;}
.btn.primary{background:linear-gradient(90deg,#7F77DD,#b06ab3);}
.summary{margin-top:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);}
.summary>div{padding:10px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;}
.summary pre{margin:0;padding:0 14px 12px;white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--muted);display:none;}
.summary.open pre{display:block;}
</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="tbtn" id="themeBtn" title="主题切换">🌙</button>
    <button class="tbtn" id="fsDown" title="缩小">A-</button>
    <button class="tbtn" id="fsUp" title="放大">A+</button>
  </div>
  <div class="card" id="fields"></div>
  <button class="random" id="rand">🎲 一键随机生成（自动组合全部属性）</button>
  <div class="hint" id="hint"></div>
  <div class="nav">
    <button class="btn primary" id="start">▶ 开始生成</button>
  </div>
  <div class="summary" id="summary">
    <div id="sumToggle">📋 当前已选汇总（点击展开）<span id="sumCount"></span></div>
    <pre id="sumBody"></pre>
  </div>
</div>
<script>
const DIMS=[
{"key":"identity","name":"身份","pool":["太傅嫡女","镇北侯府庶女","教坊司女冠","相国府长孙媳","将军府遗孀","尚仪局女官","宗室格格","商贾之女","宫中女史","翰林侍读之妹","御史千金","节度使夫人之妹","国公府侍妾","盐商总管之女","书院山长之女","禁军统领之妹","县主","郡君","命妇随嫁侄女","边将遗孤"]},
{"key":"age","name":"年龄","num":true},
{"key":"personality","name":"性格","pool":["清冷","娇憨","腹黑","温婉","妩媚","傲娇","慵懒","端庄","灵动","倔强","外柔内刚","天真烂漫","冷艳","疏淡","泼辣","狡黠","忧郁","痴情","敏感多思","强势","木讷","胆怯","缠绵","孤高"]},
{"key":"figure","name":"身材","pool":["纤秾合度","高挑修长","娇小玲珑","丰腴婀娜","骨肉匀停","削肩细腰","蜜桃翘臀","酥胸如玉","长腿玉立","蜂腰雪肤","清瘦见骨","珠圆玉润","窄肩薄背","腿根丰盈","胸臀微丰"]},
{"key":"fetish","name":"性癖","pool":["偏好被温柔以待","喜欢耳畔低语","贪恋掌心温度","享受被缓缓引导","中意缓慢试探","喜好被赞美才情","偏爱烛下私语","钟情指尖流连","易被低沉嗓音撩动","贪恋被注视","偏好被强势掌控","喜闻情话呢喃","暗嗜被轻制手腕","易为私语脏话所诱","偏好被从后拥住","喜闻喘息近耳","贪恋被抚摸发丝","偏爱人前隐忍","暗嗜被窥视感","喜闻夸其美好"]},
{"key":"sensitive","name":"敏感点","pool":["耳垂","后颈","腰窝","锁骨","指尖","手腕内侧","脚踝","颈侧","肋间","大腿内侧"]},
{"key":"pidentity","name":"玩家身份","pool":["西席先生","新任管家","远房表亲","府中护卫教头","走方郎中","采买管事","门客清客","婢女之兄","账房先生","媒妁之士","马厩管事","园中匠人"]}
];
const state={};
(function(){
  var box=document.getElementById('fields');
  DIMS.forEach(function(d){
    var f=document.createElement('div'); f.className='field';
    var h='<label>'+d.name+'</label>';
    if(d.num){
      h+='<p class="sub">仅限成年女性（18–50）。</p>';
      h+='<input type="number" id="f_'+d.key+'" min="18" max="50" placeholder="18–50">';
      h+='<div class="cust">或自定义：<input type="text" id="c_'+d.key+'" placeholder="手打年龄"></div>';
    } else {
      h+='<p class="sub">'+d.name+'，决定初遇时的关系与态度。</p>';
      h+='<select id="f_'+d.key+'"><option value="">— 请选择 —</option>';
      d.pool.forEach(function(v){ h+='<option value="'+v+'">'+v+'</option>'; });
      h+='</select>';
      h+='<div class="cust">或自定义：<input type="text" id="c_'+d.key+'" placeholder="手打'+d.name+'"></div>';
    }
    f.innerHTML=h; box.appendChild(f);
  });
})();
function getDim(d){
  var c=document.getElementById('c_'+d.key).value.trim();
  if(c) return c;
  return document.getElementById('f_'+d.key).value.trim();
}
function collect(){ DIMS.forEach(function(d){ state[d.key]=getDim(d); }); }
function renderSummary(){
  collect(); var n=0,t='';
  DIMS.forEach(function(d){ if(state[d.key]){ n++; t+=d.name+'：'+state[d.key]+'\n'; } });
  document.getElementById('sumCount').textContent='（'+n+'/'+DIMS.length+'）';
  document.getElementById('sumBody').textContent=t||'（尚未填写）';
}
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function randomAll(){
  DIMS.forEach(function(d){
    if(d.num){ document.getElementById('f_'+d.key).value=String(18+Math.floor(Math.random()*33)); document.getElementById('c_'+d.key).value=''; }
    else { document.getElementById('f_'+d.key).value=rnd(d.pool); document.getElementById('c_'+d.key).value=''; }
  });
  document.getElementById('hint').textContent='已随机填充，可手动微调。';
  renderSummary();
}
function validate(){
  collect();
  for(var i=0;i<DIMS.length;i++){ var d=DIMS[i]; if(!state[d.key]){ document.getElementById('hint').textContent='「'+d.name+'」尚未填写，请补全。'; return false; } }
  var age=state['age']; if(age&&(parseInt(age)<18||parseInt(age)>50||isNaN(parseInt(age)))){ document.getElementById('hint').textContent='年龄必须在 18–50 之间。'; return false; }
  return true;
}
function start(){
  if(!validate()) return;
  collect();
  var parts=[];
  DIMS.forEach(function(d){ if(state[d.key]) parts.push(d.name+'='+state[d.key]); });
  send('【生成目标｜自定义：'+parts.join('｜')+'】');
  document.getElementById('hint').textContent='已发送，等待 AI 生成猎物…';
}
function send(t){
  if(typeof triggerSlash==='function'){ triggerSlash('/send '+t+' |/trigger'); return; }
  if(typeof TavernHelper!=='undefined'&&TavernHelper&&typeof TavernHelper.triggerSlash==='function'){ TavernHelper.triggerSlash('/send '+t+' |/trigger'); return; }
  if(window.SillyTavern&&typeof SillyTavern.getContext==='function'){ var c=SillyTavern.getContext(); if(c&&typeof c.executeSlashCommands==='function'){ c.executeSlashCommands('/send '+t+' |/trigger'); return; } }
  console.log('[选择器] 发送：'+t);
  alert('未检测到酒馆助手接口(triggerSlash)。请复制下方指令手动发送：\n'+t);
}
document.getElementById('rand').onclick=function(){ randomAll(); window.scrollTo(0,0); };
document.getElementById('start').onclick=start;
document.getElementById('sumToggle').onclick=function(){ document.getElementById('summary').classList.toggle('open'); };
renderSummary();
</script>
</body></html>
