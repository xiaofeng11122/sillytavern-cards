<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>能力定制</title><style>:root{ --bg:#15131f; --panel:#1f1b2e; --fg:#e9e6f5; --muted:#9b94b8; --accent:#7F77DD; --accent2:#5a6b7d; --border:rgba(136,136,136,.35); --fs:15px; }
body.light{ --bg:#f4f3f8; --panel:#ffffff; --fg:#22202c; --muted:#6b6580; --border:rgba(0,0,0,.15); }
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--fg);font-size:var(--fs);padding:10px;}
.wrap{max-width:520px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.prog{flex:1;height:8px;background:var(--panel);border-radius:6px;overflow:hidden;}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:.25s;}
.tbtn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;}
.page{display:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.page.active{display:block;}
h3{margin:0 0 4px;font-size:17px;}
.sub{font-size:12px;color:var(--muted);margin:0 0 12px;}
label{display:block;font-size:13px;margin:10px 0 4px;}
input[type=text],input[type=number],select{width:100%;padding:7px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--fg);font-size:14px;}
.cust{font-size:12px;color:var(--muted);margin-top:2px;}
.nav{display:flex;gap:8px;margin-top:16px;}
.nav button{flex:1;padding:10px;border:none;border-radius:9px;cursor:pointer;font-size:14px;color:#fff;}
#prev{background:var(--accent2);}
#next{background:var(--accent);}
#start{background:linear-gradient(90deg,#7F77DD,#b06ab3);display:none;}
.summary{margin-top:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);}
.summary>div{padding:10px 14px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;}
.summary pre{margin:0;padding:0 14px 12px;white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--muted);display:none;}
.summary.open pre{display:block;}
.random{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px;margin:8px 0;}
.hint{font-size:12px;color:#e07b7b;min-height:16px;margin-top:6px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.btn{width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;font-size:14px;color:#fff;margin-top:10px;}
.btn.primary{background:linear-gradient(90deg,#7F77DD,#b06ab3);}
.btn.ghost{background:var(--accent2);}</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="tbtn" id="themeBtn" title="主题切换">🌙</button>
    <button class="tbtn" id="fsDown" title="缩小">A-</button>
    <button class="tbtn" id="fsUp" title="放大">A+</button>
  </div>
  <div class="page active">
    <h3>① 玩家能力 · 采花大盗的根基</h3>
    <p class="sub">先雕琢自身，再启程。此项一经确认即永久锁定，不可更改。</p>
    <label>个人能力</label>
    <input type="text" id="ability" placeholder="如：轻功卓绝，踏雪无痕">
    <label>个人身材（四选一）</label>
    <div class="radios" id="bodyRadios" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;"></div>
    <label>性器官长度</label>
    <input type="text" id="len" placeholder="自行输入">
    <div class="hint" id="hint"></div>
    <button class="btn primary" id="confirm" style="margin-top:14px;">确认能力定制</button>
  </div>
</div>
<script>
const BODY=["匀称精壮", "高大魁梧", "清瘦矫健", "修长挺拔"];
(function(){ var box=document.getElementById('bodyRadios'); BODY.forEach(function(v){ var l=document.createElement('label'); l.style.cssText='display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;margin:0;font-size:13px;'; l.innerHTML='<input type="radio" name="body" value="'+v+'">'+v; box.appendChild(l); }); })();
document.getElementById('confirm').onclick=function(){
  var a=document.getElementById('ability').value.trim();
  var r=document.querySelector('input[name="body"]:checked');
  var b=r?r.value:'';
  var l=document.getElementById('len').value.trim();
  var hint=document.getElementById('hint');
  if(!a||!b||!l){ hint.textContent='个人能力、个人身材(选一项)、性器官长度都要填写完整。'; return; }
  var val=a+'｜'+b+'｜'+l;
  this.disabled=true;
  saveVar('panelAbility', val, function(ok){
    readVars(function(vars){
      if(ok && vars && vars.panelTarget){
        // 对象已确认：合并成一条发出
        var t='确认能力定制｜个人能力：'+a+'｜个人身材：'+b+'｜性器官长度：'+l+'　【生成目标｜自定义：'+vars.panelTarget+'】';
        clearVars(['panelAbility','panelTarget']);
        send(t, hint);
      } else if(ok){
        this.disabled=false;
        hint.textContent='✓ 能力已暂存。请在「寝取角色生成器」完成确认——两边都确认后会合并为一条消息发出。';
      } else {
        this.disabled=false;
        send('确认能力定制｜个人能力：'+a+'｜个人身材：'+b+'｜性器官长度：'+l, hint);
      }
    }.bind(this));
  }.bind(this));
};
function slash(cmd){
  return new Promise(function(res,rej){
    try{
      if(typeof triggerSlash==='function'){ var p=triggerSlash(cmd); if(p&&p.then){p.then(res,rej);}else{res();} return; }
      if(window.TavernHelper&&typeof TavernHelper.triggerSlash==='function'){ var p2=TavernHelper.triggerSlash(cmd); if(p2&&p2.then){p2.then(res,rej);}else{res();} return; }
      if(window.SillyTavern&&typeof SillyTavern.getContext==='function'){ var c=SillyTavern.getContext(); if(c&&typeof c.executeSlashCommands==='function'){ var p3=c.executeSlashCommands(cmd); if(p3&&p3.then){p3.then(res,rej);}else{res();} return; } }
      rej(new Error('未检测到酒馆助手接口'));
    }catch(e){ rej(e); }
  });
}
function readVars(cb){
  try{
    if(typeof getVariables==='function'){ var p=getVariables({type:'chat'}); if(p&&p.then){p.then(function(v){cb(v||{});}).catch(function(){cb(null);});}else{cb(p||{});} return; }
    if(window.TavernHelper&&typeof TavernHelper.getVariables==='function'){ var p2=TavernHelper.getVariables({type:'chat'}); if(p2&&p2.then){p2.then(function(v){cb(v||{});}).catch(function(){cb(null);});}else{cb(p2||{});} return; }
  }catch(e){}
  cb(null);
}
function saveVar(k,v,cb){
  try{
    if(typeof insertOrAssignVariables==='function'){ var p=insertOrAssignVariables((function(o){o[k]=v;return o;})({}),{type:'chat'}); if(p&&p.then){p.then(function(){cb(true);},function(){cb(false);});}else{cb(true);} return; }
    if(window.TavernHelper&&typeof TavernHelper.insertOrAssignVariables==='function'){ var p2=TavernHelper.insertOrAssignVariables((function(o){o[k]=v;return o;})({}),{type:'chat'}); if(p2&&p2.then){p2.then(function(){cb(true);},function(){cb(false);});}else{cb(true);} return; }
    slash('/setvar key='+k+' '+v).then(function(){cb(true);},function(){cb(false);}); return;
  }catch(e){ cb(false); }
}
function clearVars(keys){
  keys.forEach(function(k){ try{
    if(typeof deleteVariable==='function'){ deleteVariable(k,{type:'chat'}); return; }
    if(window.TavernHelper&&typeof TavernHelper.deleteVariable==='function'){ TavernHelper.deleteVariable(k,{type:'chat'}); return; }
    saveVar(k,'',function(){});
  }catch(e){} });
}
function send(t,hint){
  if(hint) hint.textContent='发送中…';
  slash('/send '+t).then(function(){
    setTimeout(function(){
      slash('/trigger').then(function(){ if(hint) hint.textContent='✓ 已合并发出，等待 AI 回应…'; }).catch(function(e){ if(hint) hint.textContent='⚠ 触发失败，请手动发送：'+t; });
    },700);
  }).catch(function(e){ if(hint) hint.textContent='⚠ 发送失败：'+e; });
}
document.getElementById('themeBtn').onclick=function(){ var b=document.body; b.classList.toggle('light'); this.textContent=b.classList.contains('light')?'☀️':'🌙'; };
document.getElementById('fsDown').onclick=function(){ var s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')); s=Math.max(12,s-1); document.documentElement.style.setProperty('--fs',s+'px'); };
document.getElementById('fsUp').onclick=function(){ var s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')); s=Math.min(20,s+1); document.documentElement.style.setProperty('--fs',s+'px'); };
</script>
</body></html>
