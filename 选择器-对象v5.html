function motherOf(cat,pos,rel,rank){
  if(cat==='宫廷女官') return '掌事姑姑（本局尚宫／司正）';
  if(cat==='宗室皇亲'){

  }
  if(!pos) return '—';
  if(P.posSYS['妻媳系'].indexOf(pos)>=0) return '婆母（现任家主正妻）';
  if(P.posSYS['妾婢系'].indexOf(pos)>=0) return '主母（夫之正妻）';

function el(id){return document.getElementById(id);}
function val(id){var e=el(id);return e?String(e.value).trim():'';}
function setv(id,v){var e=el(id);if(e)e.value=v;}

  h+='<div class="'+p+'row"><span class="'+p+'mini">底色</span><select id="f_temper"><option value="">— 请选择 —</option>'+opts(P.temper)+'</select></div>';

  h+='<div class="'+cls+'"><label>身材</label><p class="'+p+'sub">骨架 × 身量 × 局部 × 乳 × 臀，五维组合。</p>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">骨架</span><select id="f_build"><option value="">— 请选择 —</option>'+opts(P.build)+'</select></div>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">身量</span><select id="f_stature"><option value="">— 请选择 —</option>'+opts(P.stature)+'</select></div>';

  h+='<div class="'+p+'row"><span class="'+p+'mini">臀</span><select id="f_hip"><option value="">— 请选择 —</option>'+opts(P.hip)+'</select></div>';

  /* 性癖 */
  h+='<div class="'+cls+'"><label>性癖</label><p class="'+p+'sub">触发通道 × 偏好强度 × 场景，三维组合成句。</p>';

  h+='<div class="'+p+'row"><span class="'+p+'mini">主</span><select id="f_sensMain"><option value="">— 请选择 —</option>'+opts(P.sensBody)+'<optgroup label="性征">'+opts(P.sensSex)+'</optgroup></select></div>';
  h+='<div class="'+p+'row"><span class="'+p+'mini">次</span><select id="f_sensSub"><option value="">— 请选择 —</option>'+opts(P.sensBody)+'<optgroup label="性征">'+opts(P.sensSex)+'</optgroup></select></div>';

}

/* ================= 交互 ================= */
function curCat(){return val('idCat');}
function fillOffices(){
  var r=val('g_rank'),s=el('g_office'); if(!s) return;
  var list=(r&&P.guanOffice[r])?P.guanOffice[r]:[];
  s.innerHTML='<option value="">'+(r?'— 请选择 —':'— 请先选品级 —')+'</option>'+opts(list);
}
function fillHouses(){
  var r=val('idRank'),s=el('idHouse'); if(!s) return;
  var list=(r&&P.houses[r])?P.houses[r]:[];
  s.innerHTML='<option value="">'+(r?'— 请选择 —':'— 请先选门第 —')+'</option>'+opts(list);
}
function onCat(){
  var c=curCat();
  [['grpZong','宗室皇亲'],['grpGuan','朝官家眷'],['grpWai','外官家眷'],['grpNoble','世家女眷'],['grpNy','宫廷女官']]
    .forEach(function(x){ var g=el(x[0]); if(g) g.style.display=(c===x[1])?'block':'none'; });
  showLive();
}
function onZRel(){
  var r=val('z_rel');
  var a=el('zNv'),b=el('zFu');
  if(a) a.style.display=(r==='宗室女')?'block':'none';
  if(b) b.style.display=(r==='宗室妇')?'block':'none';
  showLive();
}
/* 身份串 */
function identity(){
  var c=curCat();
  if(c==='宗室皇亲'){
    if(val('z_rel')==='宗室妇') return val('z_wife');
    var r=val('z_rank'),m=val('z_marry');
    return (r&&m)?(m+r):'';
  }
  if(c==='朝官家眷'){ var a=val('g_rank'),b=val('g_office'),p=val('g_pos'); return (a&&b&&p)?(a+b+'之'+p):''; }
  if(c==='外官家眷'){ var a2=val('w_place'),b2=val('w_office'),p2=val('w_pos'); return (b2&&p2)?((a2||'')+b2+'之'+p2):''; }
  if(c==='世家女眷'){ var h=val('idHouse'),p3=val('idPos'); return (h&&p3)?(h+p3):''; }
  if(c==='宫廷女官'){ var bu=val('n_bureau'),du=val('n_duty'); return (bu&&du)?(bu+du):''; }
  return '';
}
/* 居所预览 */
function liveInfo(){
  var c=curCat(),out={live:'',zone:'',mz:'',pos:''};
  if(c==='宗室皇亲'){
    if(val('z_rel')==='宗室妇'){ var w=val('z_wife'); out.live=P.zWifeLive[w]||''; out.zone='A2 王府'; out.mz=motherOf(c,'','宗室妇',''); }
    else{ var r=val('z_rank'),m=val('z_marry'); if(r&&m){ out.live=P.zLive[r+'|'+m]||''; out.zone=P.zZone[r+'|'+m]||''; out.mz=motherOf(c,'','宗室女',r); } }
  } else if(c==='朝官家眷'){
    var gr=val('g_rank'),go=val('g_office'),gp=val('g_pos');
    if(gr) out.live=P.guanHome[gr]||'';
    out.mz=motherOf(c,gp,'','');
  } else if(c==='外官家眷'){
    var wo=val('w_office'),wp=val('w_pos');
    if(wo) out.live=P.waiLive[wo]||'';
    out.mz=motherOf(c,wp,'','');
  } else if(c==='世家女眷'){
    var nr=val('idRank'),nh=val('idHouse'),np=val('idPos');
    if(nr) out.zone=P.nobleZone[nr]||'';
    if(nh) out.live=nh+'（'+(out.zone||'')+'）';
    out.mz=motherOf(c,np,'','');
  } else if(c==='宫廷女官'){
    if(val('n_bureau')){ out.live='内廷·六局廨舍／掖庭偏院（终身居宫中，不得外宿）'; out.zone='A1 宫城'; out.mz='掌事姑姑（本局尚宫／司正）'; }
  }
  return out;
}
function showLive(){
  var box=el('sgLive'); if(!box) return;
  var li=liveInfo();
  if(!li.live && !li.mz){ box.innerHTML='— 选定身份后，此处显示对应的居所与宅制 —'; return; }
  var h='';
  if(li.live) h+='<b>居所：</b>'+li.live;
  if(li.zone) h+='<br><b>宅制：</b>'+li.zone;
  if(li.mz && li.mz!=='—') h+='<br><b>主母位：</b>'+li.mz;
  var id=identity();
  if(id) h+='<br><span class="ok">✓ 身份：「'+id+'」</span>';
  box.innerHTML=h;
}
function suggestAge(){
  var c=curCat(),p='';
  if(c==='世家女眷') p=val('idPos'); else if(c==='朝官家眷') p=val('g_pos'); else if(c==='外官家眷') p=val('w_pos');
  var a=AGE[p];
  if(!a){
    if(c==='宗室皇亲'){
      if(val('z_rel')==='宗室妇') a=[22,45];
      else a=(val('z_marry')==='已嫁')?[20,40]:[18,34];
    } else if(c==='宫廷女官') a=[20,45];
    else if(c==='朝官家眷'||c==='外官家眷') a=[18,32];
  }
  if(a){ setv('f_age',String(a[0]+Math.floor(Math.random()*(a[1]-a[0]+1)))); }
}
function collect(){
  var o={};
  o.identity = val('c_identity') || identity();
  o.age = val('c_age') || val('f_age');
  o.personality = val('c_personality') || (function(){var a=val('f_temper'),b=val('f_facade');return (a&&b)?(a+'·'+b):'';})();
  o.figure = val('c_figure') || (function(){
    var a=[val('f_build'),val('f_stature'),val('f_detail'),val('f_bosom'),val('f_hip')];
    for(var i=0;i<a.length;i++){ if(!a[i]) return ''; }
    return a.join('·');
  })();
  o.fetish = val('c_fetish') || (function(){
    var c=val('f_fetch'),i=val('f_fetint'),s=val('f_fetsc');
    if(!c||!i||!s) return '';
    return P.fetIntW[i]+P.fetChW[c]+'，'+P.fetScW[s]+'尤甚';
  })();
  o.sensitive = val('c_sensitive') || (function(){
    var a=val('f_sensMain'),b=val('f_sensSub'); return (a&&b)?('主：'+a+'｜次：'+b):'';
  })();
  return o;
}
var NAMES=['身份','年龄','性格','身材','性癖','敏感点'];
var KEYS=['identity','age','personality','figure','fetish','sensitive'];
function toParts(o){
  var p=[]; for(var i=0;i<KEYS.length;i++){ p.push(NAMES[i]+'='+(o[KEYS[i]]||'')); }
  var li=liveInfo(); if(li.live) p.push('居所='+li.live.split('（')[0]);
  return p.join('｜');
}
function check(o){
  for(var i=0;i<KEYS.length;i++){ if(!o[KEYS[i]]) return '「'+NAMES[i]+'」尚未填写，请补全。'; }
  var age=o.age;
  if(age&&(parseInt(age)<18||parseInt(age)>50||isNaN(parseInt(age)))) return '年龄必须在 18–50 之间。';
  var c=curCat();
  if(c==='宗室皇亲'&&val('z_rel')==='宗室女'&&(!val('z_rank')||!val('z_marry'))) return '宗室女需选爵级与婚否。';
  if(c==='宗室皇亲'&&val('z_rel')==='宗室妇'&&!val('z_wife')) return '宗室妇需选封号。';
  return '';
}
function randomAll(){
  emptyAll();
  var c=rnd(P.cat); setv('idCat',c); onCat();
  if(c==='宗室皇亲'){
    var rel=(Math.random()<0.62)?'宗室女':'宗室妇'; setv('z_rel',rel); onZRel();
    if(rel==='宗室女'){ var r=rnd(P.zRank),m=rnd(P.zMarry); setv('z_rank',r); setv('z_marry',m); }
    else { setv('z_wife',rnd(P.zWife)); }
  } else if(c==='朝官家眷'){
    var gr=rnd(P.guanRank); setv('g_rank',gr); fillOffices();
    setv('g_office',rnd(P.guanOffice[gr])); setv('g_pos',rnd(allPos()));
  } else if(c==='外官家眷'){
    setv('w_office',rnd(P.waiOffice)); setv('w_place',rnd(P.waiPlace)); setv('w_pos',rnd(allPos()));
  } else if(c==='世家女眷'){
    var nr=rnd(P.rank); setv('idRank',nr); fillHouses();
    setv('idHouse',rnd(P.houses[nr])); setv('idPos',rnd(allPos()));
  } else {
    setv('n_bureau',rnd(P.bureau)); setv('n_duty',rnd(P.duty));
  }
  suggestAge();
  setv('f_temper',rnd(P.temper)); setv('f_facade',rnd(P.facade));
  setv('f_build',rnd(P.build)); setv('f_stature',rnd(P.stature));
  setv('f_detail',rnd(P.detail)); setv('f_bosom',rnd(P.bosom)); setv('f_hip',rnd(P.hip));
  setv('f_fetch',rnd(P.fetCh)); setv('f_fetint',rnd(P.fetInt)); setv('f_fetsc',rnd(P.fetSc));
  var all=P.sensBody.concat(P.sensSex);
  var a=rnd(all),b=rnd(all); while(b===a){ b=rnd(all); }
  setv('f_sensMain',a); setv('f_sensSub',b);
  showLive();
}
function bindFields(){
  var c=el('idCat'); if(c) c.onchange=onCat;
  var z=el('z_rel'); if(z) z.onchange=onZRel;
  /* 联动下拉：既要重填子选项，也要刷新居所预览与年龄建议 */
  var gr=el('g_rank'); if(gr) gr.onchange=function(){ fillOffices(); suggestAge(); showLive(); };
  var nr=el('idRank'); if(nr) nr.onchange=function(){ fillHouses(); suggestAge(); showLive(); };
  ['g_pos','w_pos','idPos','z_rank','z_marry','z_wife',
   'g_office','w_office','w_place','idHouse','n_bureau','n_duty']
    .forEach(function(k){ var e=el(k); if(e) e.onchange=function(){ suggestAge(); showLive(); }; });
}

document.getElementById('sgFields').innerHTML=buildFields('sg-field','sg-');
bindFields();
document.getElementById('sgRand').onclick=function(){
  randomAll();
  document.getElementById('sgHint').textContent='已随机填充，可手动微调。';
};
document.getElementById('sgStart').onclick=function(){
  var o=collect(); var err=check(o);
  var hint=document.getElementById('sgHint');
  if(err){ hint.textContent=err; return; }
  var t='【生成目标｜自定义：'+toParts(o)+'】';
  function slash(cmd){
    return new Promise(function(res,rej){
      try{
        if(typeof triggerSlash==='function'){ var p=triggerSlash(cmd); if(p&&p.then){p.then(res,rej);}else{res();} return; }
        if(window.TavernHelper&&typeof TavernHelper.triggerSlash==='function'){ var p2=TavernHelper.triggerSlash(cmd); if(p2&&p2.then){p2.then(res,rej);}else{res();} return; }
        if(window.SillyTavern&&typeof SillyTavern.getContext==='function'){ var c=SillyTavern.getContext(); if(c&&typeof c.executeSlashCommands==='function'){ var p3=c.executeSlashCommands(cmd); if(p3&&p3.then){p3.then(res,rej);}else{res();} return; } }
        rej(new Error('未检测到酒馆助手接口'));
      }catch(e){ rej(e); }
    });
  }
  hint.textContent='生成中…';
  slash('/send '+t).then(function(){
    setTimeout(function(){
      slash('/trigger').then(function(){ hint.textContent='✓ 已重新生成，AI 正在回应…'; }).catch(function(){ hint.textContent='⚠ 触发失败，请手动发送：'+t; });
    },700);
  }).catch(function(e){ hint.textContent='⚠ 发送失败：'+e; });
};
document.getElementById('sgTheme').onclick=function(){
  var r=document.getElementById('root'); r.classList.toggle('light');
  this.textContent= r.classList.contains('light')?'☀️':'🌙';
};
})();
